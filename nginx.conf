server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    root /usr/share/nginx/html;
    server_tokens off;

    ssl_certificate /etc/nginx/tls/ssl-cert-snakeoil.pem;
    ssl_certificate_key /etc/nginx/tls/ssl-cert-snakeoil.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;

    add_header Cache-Control "no-store" always;
    add_header Content-Security-Policy "default-src 'none'; img-src data:; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    location = /status.php {
        default_type application/json;
        try_files /status.php =500;
    }

    location / {
        try_files /index.html =500;
    }
}
